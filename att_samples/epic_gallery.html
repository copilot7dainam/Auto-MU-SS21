<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MU S21 (epicmu) — bản đồ đi được</title>
<style>
 body{background:#0f1115;color:#e6e6e6;font:14px/1.5 system-ui,sans-serif;margin:0;padding:20px}
 h1{font-size:20px;margin:0 0 4px}
 p.sub{color:#9aa;margin:0 0 16px}
 .legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px;font-size:12px}
 .legend span{display:flex;align-items:center;gap:6px}
 .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid #333}
 .row{display:flex;gap:12px;flex-wrap:wrap}
 .card{background:#171a21;border:1px solid #262b36;border-radius:8px;padding:8px;width:140px;cursor:pointer}
 .card:hover{border-color:#3a4254}
 .card h3{margin:0 0 4px;font-size:13px}
 .card .lbl{color:#9aa;font-size:11px;margin-bottom:4px;min-height:14px}
 canvas{image-rendering:pixelated;width:124px;height:124px;border:1px solid #333;display:block;cursor:crosshair}
 #tip{position:fixed;background:#000c;padding:4px 8px;border-radius:4px;font-size:12px;pointer-events:none;display:none;z-index:9}
 #zoom{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20}
 #zoom .box{background:#171a21;border:1px solid #333;border-radius:10px;padding:12px;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;gap:8px}
 #zoomimg{image-rendering:pixelated;display:block;max-width:90vw;max-height:62vh;border:1px solid #444;border-radius:6px;cursor:crosshair}
 #zoom .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
 #zoom .bar b{font-size:14px}
 #zoom .bar input{background:#0f1115;color:#e6e6e6;border:1px solid #333;border-radius:4px;padding:4px 6px;font-size:13px;min-width:200px}
 #zoom .bar button{background:#2a3142;color:#e6e6e6;border:1px solid #3a4254;border-radius:5px;padding:5px 12px;cursor:pointer;font-size:13px}
 #zoom .bar button:hover{background:#343d52}
 #zoom .bar button.del{background:#5a2222;border-color:#7a2e2e}
 #zoom .bar button.close{margin-left:auto;background:#333}
 #zoom .coord{color:#9aa;font-size:12px;min-height:14px}
</style></head><body>
<h1>MU S21 (epicmu) — 70 bản đồ (MapID)</h1>
<p class="sub">Nguồn: client epicmu <code>EncTerrain*.att</code>. Đen=đi được, trắng=tường, xanh=safe, xanh dương=nước/vực. Click vào bản đồ (MapID 0-based) để phóng to, đổi tên hoặc xóa.</p>
<div class="legend">
 <span><i class="sw" style="background:#000"></i>Đi được</span>
 <span><i class="sw" style="background:#fff"></i>Tường</span>
 <span><i class="sw" style="background:#00b400"></i>Safe</span>
 <span><i class="sw" style="background:#0078ff"></i>Nước/Vực</span>
</div>
<div id="tip"></div>
<div id="zoom">
  <div class="box">
    <div class="bar">
      <b id="ztitle"></b>
      <input id="zname" type="text" placeholder="Tên map...">
      <button id="zrename">Đổi tên</button>
      <button id="zdel" class="del">Xóa World</button>
      <button id="zclose" class="close">Đóng ✕</button>
    </div>
    <img id="zoomimg" alt="">
    <div class="coord" id="zcoord">Di chuột trên ảnh để xem tọa độ</div>
  </div>
</div>
<div class="row" id="row"></div>
<script>
const LS_KEY = "epic_gallery_edits_v1";
let edits = {};
try { edits = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e) {}

function applyEdits(it){
  const e = edits[it.num];
  if (e) { if ("label" in e) it.label = e.label; if (e.removed) it.removed = true; }
  return it;
}
function saveEdits(){ localStorage.setItem(LS_KEY, JSON.stringify(edits)); }

const ITEMS = [{"file": "Map0/EncTerrain0.att.png", "wd": "Map0", "id": 0, "name": "EncTerrain0.att.png"}, {"file": "Map1/EncTerrain1.att.png", "wd": "Map1", "id": 1, "name": "EncTerrain1.att.png"}, {"file": "Map2/EncTerrain2.att.png", "wd": "Map2", "id": 2, "name": "EncTerrain2.att.png"}, {"file": "Map3/EncTerrain3.att.png", "wd": "Map3", "id": 3, "name": "EncTerrain3.att.png"}, {"file": "Map4/EncTerrain4.att.png", "wd": "Map4", "id": 4, "name": "EncTerrain4.att.png"}, {"file": "Map6/EncTerrain6.att.png", "wd": "Map6", "id": 6, "name": "EncTerrain6.att.png"}, {"file": "Map7/EncTerrain7.att.png", "wd": "Map7", "id": 7, "name": "EncTerrain7.att.png"}, {"file": "Map8/EncTerrain8.att.png", "wd": "Map8", "id": 8, "name": "EncTerrain8.att.png"}, {"file": "Map9/EncTerrain9.att.png", "wd": "Map9", "id": 9, "name": "EncTerrain9.att.png"}, {"file": "Map10/EncTerrain10.att.png", "wd": "Map10", "id": 10, "name": "EncTerrain10.att.png"}, {"file": "Map11/EncTerrain11.att.png", "wd": "Map11", "id": 11, "name": "EncTerrain11.att.png"}, {"file": "Map18/EncTerrain18.att.png", "wd": "Map18", "id": 18, "name": "EncTerrain18.att.png"}, {"file": "Map24/EncTerrain24.att.png", "wd": "Map24", "id": 24, "name": "EncTerrain24.att.png"}, {"file": "Map30/EncTerrain30.att.png", "wd": "Map30", "id": 30, "name": "EncTerrain30.att.png"}, {"file": "Map31/EncTerrain31.att.png", "wd": "Map31", "id": 31, "name": "EncTerrain31.att.png"}, {"file": "Map33/EncTerrain33.att.png", "wd": "Map33", "id": 33, "name": "EncTerrain33.att.png"}, {"file": "Map34/EncTerrain34.att.png", "wd": "Map34", "id": 34, "name": "EncTerrain34.att.png"}, {"file": "Map37/EncTerrain37.att.png", "wd": "Map37", "id": 37, "name": "EncTerrain37.att.png"}, {"file": "Map38/EncTerrain38.att.png", "wd": "Map38", "id": 38, "name": "EncTerrain38.att.png"}, {"file": "Map39/EncTerrain39.att.png", "wd": "Map39", "id": 39, "name": "EncTerrain39.att.png"}, {"file": "Map41/EncTerrain41.att.png", "wd": "Map41", "id": 41, "name": "EncTerrain41.att.png"}, {"file": "Map42/EncTerrain42.att.png", "wd": "Map42", "id": 42, "name": "EncTerrain42.att.png"}, {"file": "Map46/EncTerrain46.att.png", "wd": "Map46", "id": 46, "name": "EncTerrain46.att.png"}, {"file": "Map51/EncTerrain51.att.png", "wd": "Map51", "id": 51, "name": "EncTerrain51.att.png"}, {"file": "Map56/EncTerrain56.att.png", "wd": "Map56", "id": 56, "name": "EncTerrain56.att.png"}, {"file": "Map57/EncTerrain57.att.png", "wd": "Map57", "id": 57, "name": "EncTerrain57.att.png"}, {"file": "Map58/EncTerrain58.att.png", "wd": "Map58", "id": 58, "name": "EncTerrain58.att.png"}, {"file": "Map63/EncTerrain63.att.png", "wd": "Map63", "id": 63, "name": "EncTerrain63.att.png"}, {"file": "Map64/EncTerrain64.att.png", "wd": "Map64", "id": 64, "name": "EncTerrain64.att.png"}, {"file": "Map68/EncTerrain68.att.png", "wd": "Map68", "id": 68, "name": "EncTerrain68.att.png"}, {"file": "Map79/EncTerrain79.att.png", "wd": "Map79", "id": 79, "name": "EncTerrain79.att.png"}, {"file": "Map80/EncTerrain80.att.png", "wd": "Map80", "id": 80, "name": "EncTerrain80.att.png"}, {"file": "Map81/EncTerrain81.att.png", "wd": "Map81", "id": 81, "name": "EncTerrain81.att.png"}, {"file": "Map91/EncTerrain91.att.png", "wd": "Map91", "id": 91, "name": "EncTerrain91.att.png"}, {"file": "Map93/EncTerrain93.att.png", "wd": "Map93", "id": 93, "name": "EncTerrain93.att.png"}, {"file": "Map94/EncTerrain94.att.png", "wd": "Map94", "id": 94, "name": "EncTerrain94.att.png"}, {"file": "Map95/EncTerrain95.att.png", "wd": "Map95", "id": 95, "name": "EncTerrain95.att.png"}, {"file": "Map98/EncTerrain98.att.png", "wd": "Map98", "id": 98, "name": "EncTerrain98.att.png"}, {"file": "Map100/EncTerrain100.att.png", "wd": "Map100", "id": 100, "name": "EncTerrain100.att.png"}, {"file": "Map102/EncTerrain102.att.png", "wd": "Map102", "id": 102, "name": "EncTerrain102.att.png"}, {"file": "Map110/EncTerrain110.att.png", "wd": "Map110", "id": 110, "name": "EncTerrain110.att.png"}, {"file": "Map112/EncTerrain112.att.png", "wd": "Map112", "id": 112, "name": "EncTerrain112.att.png"}, {"file": "Map113/EncTerrain113.att.png", "wd": "Map113", "id": 113, "name": "EncTerrain113.att.png"}, {"file": "Map116/EncTerrain116.att.png", "wd": "Map116", "id": 116, "name": "EncTerrain116.att.png"}, {"file": "Map117/EncTerrain117.att.png", "wd": "Map117", "id": 117, "name": "EncTerrain117.att.png"}, {"file": "Map118/EncTerrain118.att.png", "wd": "Map118", "id": 118, "name": "EncTerrain118.att.png"}, {"file": "Map119/EncTerrain119.att.png", "wd": "Map119", "id": 119, "name": "EncTerrain119.att.png"}, {"file": "Map120/EncTerrain120.att.png", "wd": "Map120", "id": 120, "name": "EncTerrain120.att.png"}, {"file": "Map121/EncTerrain121.att.png", "wd": "Map121", "id": 121, "name": "EncTerrain121.att.png"}, {"file": "Map122/EncTerrain122.att.png", "wd": "Map122", "id": 122, "name": "EncTerrain122.att.png"}, {"file": "Map123/EncTerrain123.att.png", "wd": "Map123", "id": 123, "name": "EncTerrain123.att.png"}, {"file": "Map128/EncTerrain128.att.png", "wd": "Map128", "id": 128, "name": "EncTerrain128.att.png"}, {"file": "Map129/EncTerrain129.att.png", "wd": "Map129", "id": 129, "name": "EncTerrain129.att.png"}, {"file": "Map130/EncTerrain130.att.png", "wd": "Map130", "id": 130, "name": "EncTerrain130.att.png"}, {"file": "Map131/EncTerrain131.att.png", "wd": "Map131", "id": 131, "name": "EncTerrain131.att.png"}, {"file": "Map132/EncTerrain132.att.png", "wd": "Map132", "id": 132, "name": "EncTerrain132.att.png"}, {"file": "Map133/EncTerrain133.att.png", "wd": "Map133", "id": 133, "name": "EncTerrain133.att.png"}, {"file": "Map134/EncTerrain134.att.png", "wd": "Map134", "id": 134, "name": "EncTerrain134.att.png"}, {"file": "Map135/EncTerrain135.att.png", "wd": "Map135", "id": 135, "name": "EncTerrain135.att.png"}, {"file": "Map136/EncTerrain136.att.png", "wd": "Map136", "id": 136, "name": "EncTerrain136.att.png"}, {"file": "Map137/EncTerrain137.att.png", "wd": "Map137", "id": 137, "name": "EncTerrain137.att.png"}, {"file": "Map138/EncTerrain138.att.png", "wd": "Map138", "id": 138, "name": "EncTerrain138.att.png"}, {"file": "Map139/EncTerrain139.att.png", "wd": "Map139", "id": 139, "name": "EncTerrain139.att.png"}, {"file": "Map140/EncTerrain140.att.png", "wd": "Map140", "id": 140, "name": "EncTerrain140.att.png"}, {"file": "Map141/EncTerrain141.att.png", "wd": "Map141", "id": 141, "name": "EncTerrain141.att.png"}, {"file": "Map142/EncTerrain142.att.png", "wd": "Map142", "id": 142, "name": "EncTerrain142.att.png"}, {"file": "Map143/EncTerrain143.att.png", "wd": "Map143", "id": 143, "name": "EncTerrain143.att.png"}, {"file": "Map144/EncTerrain144.att.png", "wd": "Map144", "id": 144, "name": "EncTerrain144.att.png"}, {"file": "Map145/EncTerrain145.att.png", "wd": "Map145", "id": 145, "name": "EncTerrain145.att.png"}, {"file": "Map146/EncTerrain146.att.png", "wd": "Map146", "id": 146, "name": "EncTerrain146.att.png"}];

let current = null;  // item dang mo trong modal
const row=document.getElementById('row');
const tip=document.getElementById('tip');
const zoom=document.getElementById('zoom');
const zoomimg=document.getElementById('zoomimg');
const ztitle=document.getElementById('ztitle');
const zname=document.getElementById('zname');
const zcoord=document.getElementById('zcoord');

function render(){
  row.innerHTML='';
  const visible = ITEMS.filter(it => !it.removed);
  document.querySelector('h1').textContent =
    `MU S21 (epicmu) — ${visible.length} bản đồ`;
  for(const it of visible){
    const c=document.createElement('div');c.className='card';
    const h=document.createElement('h3');h.textContent=it.num?('World'+it.num):it.wd;
    const l=document.createElement('div');l.className='lbl';l.textContent=it.label;
    const cv=document.createElement('canvas');cv.width=256;cv.height=256;
    c.appendChild(h);c.appendChild(l);c.appendChild(cv);row.appendChild(c);
    const ctx=cv.getContext('2d');const img=new Image();
    img.onload=()=>ctx.drawImage(img,0,0);img.src=it.file;
    cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();
      const x=Math.floor((e.clientX-r.left)/r.width*256),y=Math.floor((e.clientY-r.top)/r.height*256);
      tip.style.display='block';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';
      tip.textContent=it.file.replace('.att.png','')+' ('+x+', '+y+')';});
    cv.addEventListener('mouseleave',()=>tip.style.display='none');
    c.addEventListener('click',()=>openZoom(it));
  }
}

function openZoom(it){
  current = it;
  zoomimg.src = it.file;
  ztitle.textContent = it.num ? ('World'+it.num) : it.wd;
  zname.value = it.label || '';
  zcoord.textContent = 'Di chuột trên ảnh để xem tọa độ';
  zoom.style.display = 'flex';
}

function closeZoom(){ zoom.style.display='none'; current=null; }

// Xem toa do trong modal (clientX theo anh goc 256px)
zoomimg.addEventListener('mousemove',e=>{
  if(!current) return;
  const r=zoomimg.getBoundingClientRect();
  const n=256; // kich thuoc anh goc
  const x=Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left)/r.width*n)));
  const y=Math.max(0,Math.min(n-1,Math.floor((e.clientY-r.top)/r.height*n)));
  zcoord.textContent = current.file.replace('.att.png','')+'  ('+x+', '+y+')';
});

document.getElementById('zrename').addEventListener('click',()=>{
  if(!current) return;
  const nv=zname.value.trim();
  if(!nv){ alert('Nhập tên map'); return; }
  current.label=nv;
  if(!edits[current.num]) edits[current.num]={};
  edits[current.num].label=nv; saveEdits();
  render();
});

document.getElementById('zdel').addEventListener('click',()=>{
  if(!current) return;
  if(!confirm('Xóa World'+current.num+' khỏi danh sách?')) return;
  current.removed=true;
  if(!edits[current.num]) edits[current.num]={};
  edits[current.num].removed=true; saveEdits();
  closeZoom(); render();
});

document.getElementById('zclose').addEventListener('click',closeZoom);
zoom.addEventListener('click',e=>{ if(e.target===zoom) closeZoom(); });

render();
</script>
</body></html>
